[package]
name = "deaddropd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-no-provider"] }
deaddrop-core = { version = "0.1.0", path = "../core" }
deaddrop-tls = { version = "0.1.0", path = "../tls" }
rcgen = "0.14.10"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[dev-dependencies]
deaddrop-crypto = { version = "0.1.0", path = "../crypto" }
futures-util = "0.3.34"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
