[package]
name = "deaddrop-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
deaddrop-client = { version = "0.1.0", path = "../client" }
deaddrop-tls = { version = "0.1.0", path = "../tls" }
thiserror = "2.0.21"
uniffi = { version = "0.33.0", features = ["cli"] }
