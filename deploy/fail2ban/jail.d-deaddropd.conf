# Copy to /etc/fail2ban/jail.d/deaddropd.conf
#
# Blocks, at the firewall, an address that keeps guessing the server password. The
# server itself already refuses an address after ten wrong guesses in ten minutes; this
# keeps such an address away from it altogether for a day.
#
# As written this reads the journal of the systemd service (deploy/deaddropd.service).
# For the Docker setup, replace the two "backend"/"journalmatch" lines with:
#   backend = auto
#   logpath = /var/lib/docker/containers/*/*-json.log
[deaddropd]
enabled = true
filter = deaddropd
backend = systemd
journalmatch = _SYSTEMD_UNIT=deaddropd.service
port = 7443
maxretry = 10
findtime = 10m
bantime = 1d
