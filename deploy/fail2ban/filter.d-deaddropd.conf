# Copy to /etc/fail2ban/filter.d/deaddropd.conf
#
# Matches the only lines the Dead Drop server ever logs with an address: wrong server
# passwords. Checked against fail2ban 1.1 reading the systemd journal.
[Definition]
failregex = ^(?:\S+\s+)*\S+ password-(?:failure|refused) from=<HOST>\s*$
ignoreregex =
